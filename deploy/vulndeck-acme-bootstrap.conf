# Temporary HTTP-only vhost to obtain the production Let's Encrypt certificate.
# Remove its sites-enabled symlink after certbot, then install vulndeck.conf.
server {
    listen 80;
    listen [::]:80;
    server_name vulndeck.azmirilias.com;

    root /var/www/html;
    location ^~ /.well-known/acme-challenge/ { default_type text/plain; }
    location / { return 404; }
}
