# VulnDeck production host: https://vulndeck.azmirilias.com
# Install only after DNS points at this VPS and the certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name vulndeck.azmirilias.com;

    root /var/www/html;
    location ^~ /.well-known/acme-challenge/ { default_type text/plain; }
    location / { return 301 https://vulndeck.azmirilias.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vulndeck.azmirilias.com;

    ssl_certificate     /etc/letsencrypt/live/vulndeck.azmirilias.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vulndeck.azmirilias.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/vulndeck.access.log;
    error_log  /var/log/nginx/vulndeck.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/xml application/rss+xml application/json text/plain;
    gzip_min_length 1024;
    client_max_body_size 256k;

    location /static/ {
        proxy_pass http://127.0.0.1:8090;
        expires 30d;
    }

    location ~ ^/(sitemap|sitemaps/|feed\.xml|robots\.txt) {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        expires 30m;
    }

    location / {
        limit_req zone=vulndeck burst=30 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
    }
}
