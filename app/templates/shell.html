<!doctype html>
<html lang="{{ SITE.SITE_LANG }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ SITE.SITE_NAME }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FBFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1013" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2314171A'/%3E%3Cpath d='M8 22V10l8 6 8-6v12' stroke='%23FF7A45' stroke-width='2.5' fill='none' stroke-linejoin='miter'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
{% if ld %}<script type="application/ld+json">{{ ld | safe }}</script>{% endif %}
{% block head %}{% endblock %}
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="/" aria-label="{{ SITE.SITE_NAME }} home">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17V7l7 5.5L19 7v10"/></svg>
      <span>{{ SITE.SITE_NAME }}</span>
    </a>
    <nav class="nav" aria-label="Primary">
      <a href="/ti"{% if path == '/ti' %} class="on"{% endif %}>Threat Intelligence</a>
      <a href="/th"{% if path == '/th' or path.startswith('/th/') %} class="on"{% endif %}>Threat Hunting</a>
    </nav>
  </div>
</header>

<main class="wrap">
{% block content %}{% endblock %}
</main>

<footer class="footer">
  <div class="wrap">
    <span>© {{ YEAR }} {{ SITE.ORG_NAME }} · {{ SITE.SITE_NAME }}</span>
    <span>Server-rendered · single process · no trackers</span>
  </div>
</footer>

</body>
</html>
